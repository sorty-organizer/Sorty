name: Swift CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch: {}

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast security check - runs on ubuntu (faster startup)
  security-checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose

  # Main build and test job
  build-and-test:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compute toolchain cache key
        id: toolchain
        run: |
          TOOLCHAIN_KEY=$({ xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "key=${TOOLCHAIN_KEY}" >> "$GITHUB_OUTPUT"

      # Cache SPM dependencies
      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-

      - name: Configure test Keychain
        run: |
          security create-keychain -p "" ci-test.keychain
          security default-keychain -s ci-test.keychain
          security unlock-keychain -p "" ci-test.keychain
          security set-keychain-settings -lut 21600 ci-test.keychain

      - name: Build & Test (SPM)
        run: |
          set -o pipefail
          CORES=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          # Build all active products first so SortyApp is validated
          swift build --disable-sandbox -j "$CORES"
          swift test --disable-sandbox --list-tests | tee test_inventory.log
          swift test --disable-sandbox --parallel --skip-build -j "$CORES" 2>&1 | tee unit_test_output.log
          echo "✅ Build & tests completed"

      - name: Build app via script
        env:
          SORTY_BUILD_DIR: ${{ github.workspace }}/.build
          SKIP_TESTS: "true"
          SKIP_GIT_INJECT: "true"
          BUILD_CONFIG: "debug"
          APP_ICON_VARIANT: "ci"
          ENABLE_ADHOC_SIGNING: "false"
          ENABLE_SPARKLE_SIGNING: "false"
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          echo "✅ Build script succeeded"

      - name: Pre-release validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x scripts/prerelease_check.sh
          ./scripts/prerelease_check.sh --skip-build --skip-tests --skip-sparkle

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: |
            test_inventory.log
            unit_test_output.log
            build_output.log
          retention-days: 7
          if-no-files-found: ignore
