name: Website (GitHub Pages)

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

env:
  NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ vars.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
  NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
  NEXT_PUBLIC_SENTRY_DSN: https://1a279fd4e1ae3b869fa0f5ba78ccf173@o4511816291844096.ingest.us.sentry.io/4511816327954432
  NEXT_PUBLIC_SENTRY_RELEASE: sorty-website@${{ github.sha }}
  NEXT_PUBLIC_SENTRY_DIST: ${{ github.run_id }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Validate public PostHog configuration
        shell: bash
        run: |
          if [[ ! "${NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN}" =~ ^phc_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN must be a browser-safe phc_ project token."
            exit 1
          fi

          case "${NEXT_PUBLIC_POSTHOG_HOST}" in
            https://us.i.posthog.com|https://eu.i.posthog.com) ;;
            *)
              echo "::error::NEXT_PUBLIC_POSTHOG_HOST must be an approved PostHog ingestion origin."
              exit 1
              ;;
          esac

      - name: Build static site
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: /Sorty
        run: pnpm build

      - name: Audit crawler-visible website output
        working-directory: website
        run: pnpm audit:seo

      - name: Publish Sentry website release and source maps
        working-directory: website
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sorty-z1
          SENTRY_PROJECT: sorty-website
        run: |
          if [[ -z "${SENTRY_AUTH_TOKEN}" ]]; then
            echo "::error::SENTRY_AUTH_TOKEN is required to publish source maps."
            find out/_next/static -type f -name '*.map' -delete
            exit 1
          fi

          pnpm exec sentry-cli releases new "${NEXT_PUBLIC_SENTRY_RELEASE}"
          pnpm exec sentry-cli releases set-commits \
            "${NEXT_PUBLIC_SENTRY_RELEASE}" \
            --auto \
            --ignore-missing
          pnpm exec sentry-cli sourcemaps inject out/_next/static
          pnpm exec sentry-cli sourcemaps upload \
            --release "${NEXT_PUBLIC_SENTRY_RELEASE}" \
            --dist "${NEXT_PUBLIC_SENTRY_DIST}" \
            --url-prefix "~/Sorty/_next/static" \
            out/_next/static
          pnpm exec sentry-cli releases finalize \
            "${NEXT_PUBLIC_SENTRY_RELEASE}"
          find out/_next/static -type f -name '*.map' -delete

      - name: Audit public artifact for observability secrets
        working-directory: website
        shell: bash
        run: |
          if find out -type f -name '*.map' -print -quit | grep -q .; then
            echo "::error::Source maps must not be included in the public Pages artifact."
            exit 1
          fi

          if grep -RIlE --exclude='*.map' 'phx_[A-Za-z0-9_-]+' out | grep -q .; then
            echo "::error::A privileged PostHog personal API key was found in the public artifact."
            exit 1
          fi

          if grep -RIlE --exclude='*.map' 'sntrys_[A-Za-z0-9_-]+' out | grep -q .; then
            echo "::error::A privileged Sentry auth token was found in the public artifact."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
