name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0 or 0.5.0-beta-1)'
        required: true
        type: string

concurrency:
  group: sparkle-publishing
  cancel-in-progress: false

env:
  PROJECT_NAME: Sorty
  LEGACY_APPCAST_RELEASE: v1.1.2
  LEGACY_APPCAST_SHA256: 63941687d2b08847befb4e33b7ec9cb1a9fecc09d2a7c73700850b895aa27ac8
  MINIMUM_PUBLISHED_BUILD: '202607091757'

jobs:
  prepare-release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      build_num: ${{ steps.version.outputs.BUILD_NUM }}
      is_prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          BUILD_NUM=$(date -u +%Y%m%d%H%M%S)
          if [ "$BUILD_NUM" -le "${{ env.MINIMUM_PUBLISHED_BUILD }}" ]; then
            BUILD_NUM=$((${{ env.MINIMUM_PUBLISHED_BUILD }} + 1))
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUM=${BUILD_NUM}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-beta"* ]] || [[ "$VERSION" == *"-alpha"* ]] || [[ "$VERSION" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Releasing version: ${VERSION}"

      - name: Validate release metadata
        if: steps.version.outputs.IS_PRERELEASE == 'false'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python3 - "$VERSION" <<'PY'
          import plistlib
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          with Path("Info.plist").open("rb") as handle:
              plist = plistlib.load(handle)
          if plist.get("CFBundleShortVersionString") != version:
              raise SystemExit("Info.plist version does not match the requested release.")

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\n(?P<body>.*?)(?=^## \[|\Z)",
              text,
              flags=re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md has no dated entry for {version}.")
          headings = re.findall(r"^### (.+)$", match.group("body"), flags=re.MULTILINE)
          if headings != ["New", "Improved", "Fixed"]:
              raise SystemExit("The release changelog must contain exactly: New, Improved, Fixed.")
          PY

  unit-tests:
    runs-on: blacksmith-6vcpu-macos-15
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compute toolchain cache key
        id: toolchain
        run: |
          TOOLCHAIN_KEY=$({ xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "key=${TOOLCHAIN_KEY}" >> "$GITHUB_OUTPUT"

      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-release-tests-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-release-tests-
            ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-

      - name: Configure test Keychain
        run: |
          security create-keychain -p "" ci-test.keychain
          security default-keychain -s ci-test.keychain
          security unlock-keychain -p "" ci-test.keychain
          security set-keychain-settings -lut 21600 ci-test.keychain

      - name: Run Unit Tests
        run: |
          set -o pipefail
          CORES=$(sysctl -n hw.ncpu 2>/dev/null || echo 4)
          swift build --disable-sandbox -j "$CORES"
          swift test --disable-sandbox --list-tests | tee release_test_inventory.log
          # Release tests run serially because Trash and Keychain are process-global macOS services.
          swift test --disable-sandbox --no-parallel --skip-build 2>&1 \
            | tee release_test.log \
            | tail -100

      - name: Upload release test inventory
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-test-inventory
          path: |
            release_test_inventory.log
            release_test.log
          retention-days: 7
          if-no-files-found: ignore

  build-universal:
    runs-on: blacksmith-6vcpu-macos-15
    needs:
      - prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compute toolchain cache key
        id: toolchain
        run: |
          TOOLCHAIN_KEY=$({ xcodebuild -version; swift --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | awk '{print $1}')
          echo "key=${TOOLCHAIN_KEY}" >> "$GITHUB_OUTPUT"

      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-release-universal-${{ hashFiles('Package.swift', 'Package.resolved', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-release-universal-
            ${{ runner.os }}-${{ runner.arch }}-spm-v3-${{ steps.toolchain.outputs.key }}-

      - name: Build universal app
        env:
          SORTY_BUILD_DIR: ${{ github.workspace }}/.build
          VERSION_OVERRIDE: ${{ needs.prepare-release.outputs.version }}
          BUILD_NUMBER_OVERRIDE: ${{ needs.prepare-release.outputs.build_num }}
        run: |
          chmod +x ./scripts/build.sh
          BUILD_METHOD=xcodebuild \
          SKIP_TESTS=true \
          BUILD_ARCHS="arm64 x86_64" \
          APP_ICON_VARIANT=release \
          XCODE_EXTRA_FLAGS="COMPILER_INDEX_STORE_ENABLE=NO DEBUG_INFORMATION_FORMAT=dwarf-with-dsym ENABLE_CODE_COVERAGE=NO" \
          ./scripts/build.sh

          ICON_RESOURCE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' releases/Sorty.app/Contents/Info.plist)
          test "$ICON_RESOURCE" = "AppIcon-Release-${{ needs.prepare-release.outputs.build_num }}"
          cmp \
            "Assets/AppIcon/AppIcon-Release.icns" \
            "releases/Sorty.app/Contents/Resources/${ICON_RESOURCE}.icns"
          test ! -e "releases/Sorty.app/Contents/Resources/AppIcon.icns"
          test -z "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' releases/Sorty.app/Contents/Info.plist 2>/dev/null || true)"

      - name: Verify observability credentials are not packaged
        env:
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 scripts/verify_posthog_release_secrets.py releases/Sorty.app

      - name: Publish Sentry macOS release and symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: sorty-z1
          SENTRY_PROJECT: sorty-macos
        run: |
          if [[ -z "${SENTRY_AUTH_TOKEN}" ]]; then
            echo "::error::SENTRY_AUTH_TOKEN is required to publish release symbols."
            exit 1
          fi

          RELEASE="com.sorty.app@${{ needs.prepare-release.outputs.version }}+${{ needs.prepare-release.outputs.build_num }}"
          npx --yes @sentry/cli@3.6.2 releases new "${RELEASE}"
          npx --yes @sentry/cli@3.6.2 releases set-commits "${RELEASE}" --auto
          npx --yes @sentry/cli@3.6.2 debug-files upload \
            --no-sources \
            --wait-for 60 \
            .build/DerivedData
          npx --yes @sentry/cli@3.6.2 releases finalize "${RELEASE}"

      - name: Package universal ZIP
        run: |
          chmod +x ./scripts/package.sh
          ZIP_NAME_OVERRIDE="Sorty.zip" ./scripts/package.sh

      - name: Stage build artifacts
        run: |
          mkdir -p release-artifacts
          cp -R "releases/Sorty.app" "release-artifacts/Sorty.app"
          cp "releases/Sorty.zip" "release-artifacts/"
          cp ".build/build_output.log" "release-artifacts/build_output_universal.log" 2>/dev/null || true

          # Preserve Sparkle's sign_update so the fresh release runner can sign appcasts.
          SIGN_UPDATE_TOOL=$(find \
            ".build/artifacts" \
            ".build/DerivedData/SourcePackages/artifacts" \
            -name sign_update \
            -type f \
            -not -path "*/old_dsa_scripts/*" \
            2>/dev/null | head -1)
          if [ -z "$SIGN_UPDATE_TOOL" ] || [ ! -x "$SIGN_UPDATE_TOOL" ]; then
            echo "Sparkle sign_update was not produced by the universal build." >&2
            exit 1
          fi
          mkdir -p "release-artifacts/sparkle-tools"
          cp "$SIGN_UPDATE_TOOL" "release-artifacts/sparkle-tools/sign_update"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-universal
          path: release-artifacts/
          retention-days: 7

  release:
    runs-on: blacksmith-6vcpu-macos-15
    needs:
      - prepare-release
      - unit-tests
      - build-universal
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Download universal artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ATTEMPT in 1 2 3 4 5; do
            ATTEMPT_DIR="artifact-download-${ATTEMPT}"
            if gh run download "$GITHUB_RUN_ID" \
              --name release-universal \
              --dir "$ATTEMPT_DIR"; then
              mkdir -p artifacts
              mv "$ATTEMPT_DIR" artifacts/universal
              exit 0
            fi

            if [ "$ATTEMPT" -eq 5 ]; then
              echo "Unable to download release-universal after ${ATTEMPT} attempts." >&2
              exit 1
            fi
            sleep $((ATTEMPT * 10))
          done

      - name: Prepare universal release assets
        run: |
          mkdir -p releases
          cp -R artifacts/universal/Sorty.app releases/
          cp artifacts/universal/Sorty.zip releases/

          if [ -f "artifacts/universal/sparkle-tools/sign_update" ]; then
            mkdir -p ".build/artifacts/sparkle/Sparkle/bin"
            cp "artifacts/universal/sparkle-tools/sign_update" \
               ".build/artifacts/sparkle/Sparkle/bin/sign_update"
            chmod +x ".build/artifacts/sparkle/Sparkle/bin/sign_update"
          fi

      - name: Validate downloadable app defaults and architecture
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          PLIST="releases/Sorty.app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")" = "15.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$PLIST")" = \
            "https://github.com/sorty-organizer/Sorty/releases/latest/download/appcast-v2.xml"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "$PLIST")" = "true"

          ARCHS=$(lipo -archs "releases/Sorty.app/Contents/MacOS/Sorty")
          echo "$ARCHS" | grep -qw arm64
          echo "$ARCHS" | grep -qw x86_64

          if unzip -Z1 releases/Sorty.zip | grep -Ev '^(Sorty\.app/|__MACOSX/)' | grep -q .; then
            echo "Sorty.zip contains unexpected top-level content." >&2
            exit 1
          fi

      - name: Smoke test downloadable app launch
        run: |
          chmod +x scripts/smoke_test_app_launch.sh
          scripts/smoke_test_app_launch.sh releases/Sorty.zip

      - name: Generate release notes
        run: |
          python3 scripts/generate_sparkle_release_notes.py \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --title "Sorty ${{ needs.prepare-release.outputs.version }}" \
            --summary "Faster startup and quieter background work, with safer organization and clearer status." \
            --changelog CHANGELOG.md \
            --markdown releases/release-notes.md \
            --html releases/release-notes.html
          grep -q '<h2>New</h2>' releases/release-notes.html
          grep -q '<h2>Improved</h2>' releases/release-notes.html
          grep -q '<h2>Fixed</h2>' releases/release-notes.html

      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          APPCAST_FILE_OVERRIDE: releases/appcast-v2.xml
          APPCAST_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.prepare-release.outputs.version }}/release-notes.html
        run: |
          chmod +x ./scripts/generate_appcast_ci.sh
          ZIP_NAME_OVERRIDE="Sorty.zip" ./scripts/generate_appcast_ci.sh

      - name: Validate Sparkle Update System
        run: |
          chmod +x ./scripts/validate_sparkle.sh
          ./scripts/validate_sparkle.sh \
            --appcast releases/appcast-v2.xml \
            --minimum-build "${{ env.MINIMUM_PUBLISHED_BUILD }}" \
            --expected-version "${{ needs.prepare-release.outputs.version }}" \
            --expected-channel default \
            --expected-release-tag "v${{ needs.prepare-release.outputs.version }}"

      - name: Preserve legacy key-transition appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ env.LEGACY_APPCAST_RELEASE }}" \
            --pattern appcast.xml \
            --dir releases \
            --clobber
          echo "${{ env.LEGACY_APPCAST_SHA256 }}  releases/appcast.xml" | shasum -a 256 -c -

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG_NAME="v${{ needs.prepare-release.outputs.version }}"
          if ! git tag -l | grep -q "^${TAG_NAME}$"; then
            git tag -a "${TAG_NAME}" -m "Release ${{ needs.prepare-release.outputs.version }}"
            git push origin "${TAG_NAME}"
          fi

      - name: Extract changelog for release body
        id: changelog
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          CHANGELOG_CONTENT=$(awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {in_section=1; next}
            in_section && $0 ~ "^## \\[" {exit}
            in_section {print}
          ' CHANGELOG.md | sed 's/^### /## /')

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="- No changelog entry found for v${VERSION}."
          fi

          {
            echo "release_changelog<<EOF"
            echo "$CHANGELOG_CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare-release.outputs.version }}
          name: ${{ env.PROJECT_NAME }} ${{ needs.prepare-release.outputs.version }}
          files: |
            releases/Sorty.zip
            releases/appcast.xml
            releases/appcast-v2.xml
            releases/release-notes.html
          generate_release_notes: false
          body: |
            ${{ steps.changelog.outputs.release_changelog }}

            ## Install
            Download `Sorty.zip`, open it, and move `Sorty.app` to `/Applications`.
            > ⚠️ **Note**: The app is not signed with an Apple Developer certificate. If macOS blocks the app, run:
            > ```bash
            > sudo xattr -cr /Applications/Sorty.app
            > ```
            > Paste the command into Terminal, press Return, enter your Mac password (typing stays hidden), then open Sorty from **Applications**.

          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}

      - name: Verify published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          EXPECTED_ASSETS=$(printf '%s\n' Sorty.zip appcast-v2.xml appcast.xml release-notes.html | sort)
          ACTUAL_ASSETS=$(gh release view "v${VERSION}" --json assets --jq '.assets[].name' | sort)
          if [ "$ACTUAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "Unexpected release assets:" >&2
            printf '%s\n' "$ACTUAL_ASSETS" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location --head \
            "https://github.com/${{ github.repository }}/releases/latest/download/Sorty.zip" >/dev/null
          curl --fail --silent --show-error --location \
            "https://github.com/${{ github.repository }}/releases/latest/download/appcast-v2.xml" \
            --output /tmp/appcast-v2.xml
          cmp releases/appcast-v2.xml /tmp/appcast-v2.xml
          curl --fail --silent --show-error --location \
            "https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml" \
            --output /tmp/appcast.xml
          echo "${{ env.LEGACY_APPCAST_SHA256 }}  /tmp/appcast.xml" | shasum -a 256 -c -
          curl --fail --silent --show-error --location \
            "https://github.com/${{ github.repository }}/releases/latest/download/release-notes.html" \
            --output /tmp/release-notes.html
          grep -q '<h2>New</h2>' /tmp/release-notes.html
          grep -q '<h2>Improved</h2>' /tmp/release-notes.html
          grep -q '<h2>Fixed</h2>' /tmp/release-notes.html
          curl --fail --silent --show-error --location --head \
            "https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.zip" >/dev/null
          curl --fail --silent --show-error --location --head \
            "https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz" >/dev/null

      - name: Summary
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: v${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pre-release**: ${{ needs.prepare-release.outputs.is_prerelease }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Assets" >> "$GITHUB_STEP_SUMMARY"
          ls -la releases/ >> "$GITHUB_STEP_SUMMARY"
