name: Save compiler caches
description: Save completed compiler work before tests or packaging can fail
inputs:
  kind:
    required: true
    description: spm-tests or xcode-release
  build-key:
    required: true
    description: Immutable snapshot key from restore
  build-hit:
    required: true
    description: Whether completed outputs matched exactly
  dependency-key:
    required: true
    description: Dependency key from restore
  dependency-hit:
    required: true
    description: Whether dependency downloads matched exactly
  compilation-key:
    required: true
    description: Xcode compilation store key from restore
  compilation-hit:
    required: false
    description: Whether completed compilation results matched exactly
  compile-outcome:
    required: true
    description: Whether compilation succeeded, to avoid freezing incomplete downloads
runs:
  using: composite
  steps:
    - name: Remove disposable indexes before archiving compiler directories
      shell: bash
      run: find .build -type d \( -name index -o -name Index.noindex \) -prune -exec rm -rf {} +

    - name: Save source timestamps
      shell: bash
      run: python3 scripts/ci_source_cache.py save

    - name: Save dependency downloads
      if: inputs.dependency-hit != 'true' && inputs.compile-outcome == 'success'
      uses: actions/cache/save@v6
      with:
        path: |
          .build/checkouts
          .build/repositories
          .build/artifacts
          .build/DerivedData/SourcePackages
          .build/FinderSyncDerivedData/**/SourcePackages
        key: ${{ inputs.dependency-key }}

    - name: Save incremental compiler outputs
      if: inputs.build-hit != 'true' || inputs.compile-outcome != 'success'
      uses: actions/cache/save@v6
      with:
        path: |
          .build/*-apple-macosx
          .build/debug
          .build/release
          .build/ModuleCache
          .build/DerivedData/Build
          .build/DerivedData/ModuleCache.noindex
          .build/DerivedData/SDKStatCaches.noindex
          .build/DerivedData/info.plist
          .build/FinderSyncDerivedData/**/Build
          .build/FinderSyncDerivedData/**/ModuleCache.noindex
          .build/FinderSyncDerivedData/**/SDKStatCaches.noindex
          .build/FinderSyncDerivedData/**/info.plist
          .build/manifests
          .build/*.yaml
          .build/*.json
          .build/build.db*
          .build/.sorty-cache/source-mtimes.json
          .build/.sorty-cache/assets
          .build/.sorty-cache/metal
          .build/.sorty-cache/strings
          .build/.sorty-cache/bundle-fingerprints
        key: ${{ inputs.compile-outcome == 'success' && inputs.build-key || format('{0}-partial-{1}-{2}', inputs.build-key, github.run_id, github.run_attempt) }}

    - name: Save Xcode compilation results
      if: inputs.kind == 'xcode-release' && (inputs.compilation-hit != 'true' || inputs.compile-outcome != 'success')
      uses: actions/cache/save@v6
      with:
        path: .build/CompilationCache.noindex
        key: ${{ inputs.compile-outcome == 'success' && inputs.compilation-key || format('{0}-partial-{1}-{2}', inputs.compilation-key, github.run_id, github.run_attempt) }}
